name: React CI/CD - AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build and push Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-project:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-project:${{ github.sha }}

      # 5. Deploy to AWS EC2 through SSH
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,DOCKERHUB_USERNAME
          script: |
            # Pull latest application image
            sudo docker pull $DOCKERHUB_USERNAME/cicd-project:$IMAGE_TAG

            # Stop and remove old container
            sudo docker stop react-app || true
            sudo docker rm react-app || true

            # Start new container
            sudo docker run -d \
              --name react-app \
              --restart unless-stopped \
              -p 3000:80 \
              $DOCKERHUB_USERNAME/cicd-project:$IMAGE_TAG

            # Remove unused images
            sudo docker image prune -f